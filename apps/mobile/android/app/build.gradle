apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   Monorepo npm workspaces: o package.json do app continua em apps/mobile, mas
    //   as dependências são içadas para node_modules na raiz do repositório. Os
    //   padrões do template (../../node_modules/...) apontariam para
    //   apps/mobile/node_modules, que não existe. Ver docs/21-DECISIONS.md D-040.
    root = file("../../")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/@react-native-community/cli/build/bin.js")

    //   O React Native 0.86 mudou o hermesc de `react-native/sdks/hermesc` para
    //   o pacote `hermes-compiler`. O caminho padrão do plugin aponta para o
    //   lugar antigo, e o bundle do build de aparelho falha com "Couldn't
    //   determine Hermesc location". `%OS-BIN%` é substituído pelo plugin.
    hermesCommand = file("../../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc").getAbsolutePath()

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Versão do app, em UM lugar só: os dois valores alimentam o `defaultConfig` e
 * também o nome do arquivo gerado, logo abaixo. Separados, o APK acabaria com
 * um número no nome e outro dentro dele.
 *
 * `versionCode` é o que o Android compara para decidir se é atualização; ele
 * PRECISA subir a cada APK entregue, senão o instalador recusa. `versionName` é
 * só o rótulo humano.
 */
def appVersionName = "1.1.0"
def appVersionCode = 4

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.familyfinance"
    defaultConfig {
        applicationId "com.primatetechnology.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
    }

    /**
     * Nome do arquivo: `primatewallet-<versionName>-build<versionCode>.apk`.
     *
     * O padrão `app-release.apk` do template não diz qual build é qual: dois
     * APKs em pastas diferentes ficam indistinguíveis, e já quase instalei o
     * errado. Com o numero no nome, o arquivo se identifica sozinho.
     */
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "primatewallet-${appVersionName}-build${appVersionCode}.apk"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        /**
         * Chave de UPLOAD, a que assina o que sai daqui para o telefone e, um
         * dia, para a Play Store.
         *
         * O keystore e as senhas NÃO moram no repositório: vêm de propriedades
         * do Gradle definidas em `~/.gradle/gradle.properties`, fora da árvore
         * versionada. Numa máquina sem elas, `release` simplesmente não é
         * declarado — e o `whenReady` lá embaixo recusa a build em vez de
         * assinar com a chave de debug e devolver um APK que parece pronto.
         *
         * Perder este keystore significa não conseguir mais ATUALIZAR o app
         * instalado: o Android recusa uma atualização assinada por outra chave.
         */
        if (project.hasProperty('FF_UPLOAD_STORE_FILE')) {
            release {
                storeFile file(FF_UPLOAD_STORE_FILE)
                storePassword FF_UPLOAD_STORE_PASSWORD
                keyAlias FF_UPLOAD_KEY_ALIAS
                keyPassword FF_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        /**
         * Build de VALIDAÇÃO em aparelho real.
         *
         * Existe como tipo próprio, e não como um `debug` remendado, por duas
         * razões que se contradizem em qualquer outro arranjo:
         *
         *  - precisa do JS EMBUTIDO e de `debuggable false`, senão o app tenta
         *    o Metro antes de cair no bundle e trava numa tela cinza no
         *    telefone, onde `10.0.2.2` não significa nada;
         *  - precisa aceitar TEXTO CLARO, porque a API de desenvolvimento fala
         *    HTTP na rede local — e um `release` de verdade bloqueia isso antes
         *    da primeira tela.
         *
         * Deixar o `release` permitir texto claro para atender a segunda seria
         * carregar a permissão até a loja. Aqui ela fica presa a um build cujo
         * nome diz o que ele é.
         */
        validation {
            initWith release
            matchingFallbacks = ['release']
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            // Assinado com a chave de upload própria (signingConfigs acima).
            // Quando ela não está configurada nesta máquina, o bloco `release`
            // nem existe — e a build para, em vez de cair na chave de debug.
            signingConfig project.hasProperty('FF_UPLOAD_STORE_FILE')
                ? signingConfigs.release
                : null
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

/**
 * Recusar um `release` sem chave própria, em vez de entregá-lo assinado com a
 * chave de debug.
 *
 * Um APK assim instala e abre — o problema aparece semanas depois, na hora de
 * publicar ou de atualizar, quando já não dá para trocar a chave sem desinstalar
 * o app e perder o banco local. Melhor falhar agora, com o motivo escrito.
 *
 * A verificação é por nome exato de tarefa: `assembleValidation` continua
 * funcionando sem chave nenhuma, que é o ponto daquele tipo de build.
 */
gradle.taskGraph.whenReady { graph ->
    def releaseTasks = ['assembleRelease', 'bundleRelease', 'installRelease']
    def pedindoRelease = graph.allTasks.any { releaseTasks.contains(it.name) }
    if (pedindoRelease && !project.hasProperty('FF_UPLOAD_STORE_FILE')) {
        throw new GradleException(
            "Build de release sem chave de upload.\n" +
            "Defina em ~/.gradle/gradle.properties (fora do repositório):\n" +
            "  FF_UPLOAD_STORE_FILE=<caminho do .keystore>\n" +
            "  FF_UPLOAD_STORE_PASSWORD=...\n" +
            "  FF_UPLOAD_KEY_ALIAS=...\n" +
            "  FF_UPLOAD_KEY_PASSWORD=...\n" +
            "Ver docs/26-DEPLOY.md. Para testar na rede local sem chave, use " +
            "assembleValidation."
        )
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
